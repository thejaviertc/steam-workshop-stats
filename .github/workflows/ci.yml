name: 🔨 CI

on:
    push:
        branches: [dev]

jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: 🚚 Get latest code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: 📗 Setup NodeJS
              uses: actions/setup-node@v5
              with:
                  node-version: "lts/jod"

            - name: 🔨 Build Project
              run: |
                  npm ci
                  npm run build
